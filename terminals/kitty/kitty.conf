# Kitty Terminal Configuration
# Based on wezterm configuration

# Font configuration
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Font fallbacks
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 Hack Nerd Font
symbol_map U+E000-U+F8FF JetBrains Mono

# Theme - Catppuccin Mocha
include catppuccin-mocha.conf

# Window settings
window_padding_width 10
window_margin_width 0
hide_window_decorations yes
background_opacity 0.95
window_resize_step_cells 2
window_resize_step_lines 2

# Initial window size - force very large size
initial_window_width  200c
initial_window_height 60c

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Tab title configuration - ignore window title completely, use process name only
tab_title_template "{index}:{tab.active_exe}"
# Set active tab title - same simple format
; active_tab_title_template = "{index}:{active_exe}"

tab_bar_min_tabs 1
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

# Close confirmation
confirm_os_window_close 0

# Shell configuration (OS-specific)
# Set default shell to fish for testing
shell fish
# Completely disable ALL shell integration features
shell_integration disabled
# Alternative more specific disable:
# shell_integration no-rc no-cursor no-title no-cwd no-prompt-mark no-complete
# Allow terminal programs to set the window title
allow_hyperlinks yes
# Disable automatic title updates
update_check_interval 0
# Set terminal type to prevent shell title interference
term xterm-kitty
# Prevent shell from changing window title
disable_ligatures never

# Keybindings
map alt+f toggle_fullscreen
map alt+t new_tab
map alt+q quit
map ctrl+shift+q quit
map alt+backslash launch --location=hsplit
map alt+enter launch --location=vsplit

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Window positioning and centering
remember_window_size no
placement_strategy center
resize_debounce_time 0.1
resize_draw_strategy static

# Force window size settings
window_border_width 1pt
draw_minimal_borders yes

# Window startup behavior
startup_session none
allow_remote_control yes
# Additional window size enforcement
enabled_layouts tall:bias=50;full_size=1;mirrored=false
