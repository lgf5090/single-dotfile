# Foot Terminal Configuration
# Based on wezterm configuration

[main]
term = xterm-256color
font = Hack Nerd Font:size=12
dpi-aware = yes
pad = 10x10
initial-window-size-pixels = 1200x600
shell = fish

[bell]
urgent = no
notify = no
visual = no

[scrollback]
lines = 10000

[url]
launch = xdg-open ${url}
label-letters = sadfjklewcmpgh
osc8-underline = url-mode
protocols = http, https, ftp, ftps, file, gemini, gopher
uri-characters = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_.,~:;/?#@!$&%*+="'()[]

[cursor]
style = block
color = 1e1e2e f5e0dc
blink = no

[mouse]
hide-when-typing = yes

# Catppuccin Mocha theme
[colors]
alpha = 0.95
background = 1e1e2e
foreground = cdd6f4

# Normal colors
regular0 = 45475a  # black
regular1 = f38ba8  # red
regular2 = a6e3a1  # green
regular3 = f9e2af  # yellow
regular4 = 89b4fa  # blue
regular5 = f5c2e7  # magenta
regular6 = 94e2d5  # cyan
regular7 = bac2de  # white

# Bright colors
bright0 = 585b70   # bright black
bright1 = f38ba8   # bright red
bright2 = a6e3a1   # bright green
bright3 = f9e2af   # bright yellow
bright4 = 89b4fa   # bright blue
bright5 = f5c2e7   # bright magenta
bright6 = 94e2d5   # bright cyan
bright7 = a6adc8   # bright white

# Selection colors
selection-foreground = 1e1e2e
selection-background = f5e0dc

[key-bindings]
# Toggle fullscreen
fullscreen = Alt+f

# Quit
quit = Alt+q
quit = Control+Shift+q

# Scrolling
scrollback-up-page = Shift+Page_Up
scrollback-down-page = Shift+Page_Down
scrollback-up-half-page = Control+Shift+Page_Up
scrollback-down-half-page = Control+Shift+Page_Down
scrollback-up-line = Control+Shift+Up
scrollback-down-line = Control+Shift+Down

# Copy/Paste
clipboard-copy = Control+Shift+c
clipboard-paste = Control+Shift+v
primary-paste = Shift+Insert

[search-bindings]
cancel = Control+g Escape
commit = Return
find-prev = Control+r
find-next = Control+s
cursor-left = Left Control+b
cursor-left-word = Control+Left Mod1+b
cursor-right = Right Control+f
cursor-right-word = Control+Right Mod1+f
cursor-home = Home Control+a
cursor-end = End Control+e
delete-prev = BackSpace
delete-prev-word = Mod1+BackSpace Control+BackSpace
delete-next = Delete
delete-next-word = Mod1+d Control+Delete
extend-to-word-boundary = Control+w
extend-to-next-whitespace = Control+Shift+w