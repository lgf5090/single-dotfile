# Alacritty Terminal Configuration
# Based on wezterm configuration
# windows: 	%APPDATA%\alacritty\alacritty.toml
# unix:
# 1. $XDG_CONFIG_HOME/alacritty/alacritty.toml
# 2. $XDG_CONFIG_HOME/alacritty.toml
# 3. $HOME/.config/alacritty/alacritty.toml
# 4. $HOME/.alacritty.toml
# 5. /etc/alacritty/alacritty.toml

# Terminal configuration (replaces deprecated shell section)
shell = { program = "/home/linuxbrew/.linuxbrew/bin/fish", args = [] }

[window]
opacity = 0.95
decorations = "none"
startup_mode = "Windowed"
dynamic_title = true

[window.dimensions]
columns = 120
lines = 30

[window.padding]
x = 10
y = 10

# Window positioning - centered for your screen
# Adjust these values if the position isn't perfect
[window.position]
x = 1320
y = 900

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

# Catppuccin Mocha theme
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.dim]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

# Keybindings
[[keyboard.bindings]]
key = "F"
mods = "Alt"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "T"
mods = "Alt"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Q"
mods = "Alt"
action = "Quit"

[[keyboard.bindings]]
key = "Q"
mods = "Control|Shift"
action = "Quit"

# Scrolling
[scrolling]
history = 10000
multiplier = 3

# Mouse
[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"
